[project]
name = "avia_bot"
version = "0.1.0"
description = "A simple flight-search Telegram bot with an offline-runnable core."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0,<23.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["avia_bot"]

[tool.setuptools.package-data]
avia_bot = ["data/*"]
